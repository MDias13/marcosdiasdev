<section class="contact" id="contact">
  <div class="container">
    <div class="contact__content" appFadeIn>
      <h2 class="contact__headline">
        <span class="contact__headline-top">QUERO MUDAR O MUNDO ATRAVÉS DA</span>
        <span class="contact__headline-accent">PROGRAMAÇÃO</span>
      </h2>

      <p class="contact__subtext">
        Buscando sempre novos desafios e soluções que impactam pessoas.
      </p>

      <div class="contact__actions">
        <a class="btn btn--dark" [href]="linkedin" target="_blank">
          CONECTAR NO LINKEDIN
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
            <rect x="2" y="9" width="4" height="12"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
        </a>
      </div>

      <div class="contact__links">
        <a [href]="'mailto:' + email" class="contact__link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          {{ email }}
        </a>
        <a [href]="linkedin" target="_blank" rel="noopener" class="contact__link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
            <rect x="2" y="9" width="4" height="12"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
          LinkedIn
        </a>
      </div>
    </div>
  </div>
</section>
